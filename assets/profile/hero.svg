<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto" style="background:#090B10;border-radius:8px;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D14"/>
      <stop offset="50%" stop-color="#080A0F"/>
      <stop offset="100%" stop-color="#06070B"/>
    </linearGradient>

    <!-- Radial Glow for Hero Focus -->
    <radialGradient id="violetGlow" cx="75%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#B66DDF" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#B66DDF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="88%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients for Accent Vectors -->
    <linearGradient id="violetLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B66DDF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0077B5" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#171C28" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="30" cy="0" r="0.75" fill="#263147" fill-opacity="0.8"/>
    </pattern>

    <pattern id="dotGrid" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.65" fill="#1C2333" fill-opacity="0.7"/>
    </pattern>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .editorial { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
      .title { font-weight: 800; letter-spacing: -0.03em; fill: #F0F3F8; }
      .tag { font-size: 11px; fill: #8F9CAE; letter-spacing: 0.08em; }
      .dim { fill: #48546A; }
      .accent { fill: #B66DDF; }
      .cyan-txt { fill: #38BDF8; }
      .wireframe { stroke: #222B3D; fill: none; stroke-width: 1; }
      .signal { stroke: #B66DDF; fill: none; stroke-width: 1.5; stroke-linecap: round; }
      .node-core { fill: #0B0D14; stroke: #B66DDF; stroke-width: 1.5; }
      .node-cyan { fill: #0B0D14; stroke: #00E5FF; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect x="650" y="20" width="520" height="380" fill="url(#dotGrid)" opacity="0.5"/>
  <rect width="1200" height="420" fill="url(#violetGlow)"/>
  <rect width="1200" height="420" fill="url(#cyanGlow)"/>

  <!-- Outer Structural Border & Corner Framing -->
  <rect x="1" y="1" width="1198" height="418" fill="none" stroke="#1A202C" stroke-width="1.5" rx="8"/>
  
  <!-- Technical Alignment Corner Brackets -->
  <path d="M 20 35 L 20 20 L 35 20" stroke="#B66DDF" stroke-width="2" fill="none"/>
  <path d="M 1180 35 L 1180 20 L 1165 20" stroke="#38BDF8" stroke-width="2" fill="none"/>
  <path d="M 20 385 L 20 400 L 35 400" stroke="#3A465D" stroke-width="1.5" fill="none"/>
  <path d="M 1180 385 L 1180 400 L 1165 400" stroke="#3A465D" stroke-width="1.5" fill="none"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(48, 48)">
    <rect x="0" y="0" width="8" height="8" fill="#B66DDF"/>
    <text x="18" y="8" class="mono tag" font-weight="600" fill="#B66DDF">SYS.ID // 0x47-RESEARCH</text>
    <text x="210" y="8" class="mono tag dim">|</text>
    <text x="228" y="8" class="mono tag">AFFIL: BITS PILANI, GOA</text>
    <text x="430" y="8" class="mono tag dim">|</text>
    <text x="448" y="8" class="mono tag">DOMAIN: SILICON × SYSTEMS × INTELLIGENCE</text>
  </g>

  <!-- Left Editorial Column: Name & Stance -->
  <g transform="translate(48, 120)">
    <!-- Primary Heading -->
    <text x="0" y="44" class="editorial title" font-size="52">KUSHAGRA SINGH</text>

    <!-- Subtitle / Stance -->
    <g transform="translate(0, 80)">
      <line x1="0" y1="0" x2="38" y2="0" stroke="#B66DDF" stroke-width="2.5"/>
      <text x="48" y="4" class="mono" font-size="13" font-weight="700" fill="#B66DDF" letter-spacing="0.22em">SILICON  /  SYSTEMS  /  INTELLIGENCE</text>
    </g>

    <!-- Core Research Synopsis -->
    <text x="0" y="128" class="editorial" font-size="15" fill="#9AA4B2" line-height="1.6" letter-spacing="0.01em">
      <tspan x="0" dy="0">High-performance systems engineering spanning state-space sequence models,</tspan>
      <tspan x="0" dy="24">custom CUDA scan kernels, in-process compilers, and spintronic SOT-MTJ hardware.</tspan>
    </text>

    <!-- Technical Parameter Tags -->
    <g transform="translate(0, 185)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="158" height="26" fill="#10141D" stroke="#222C3E" rx="3"/>
        <circle cx="12" cy="13" r="3" fill="#B66DDF"/>
        <text x="24" y="17" class="mono" font-size="10.5" fill="#CED5E0" letter-spacing="0.04em">SSM / S6 / MAMBA</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(168, 0)">
        <rect x="0" y="0" width="168" height="26" fill="#10141D" stroke="#222C3E" rx="3"/>
        <circle cx="12" cy="13" r="3" fill="#38BDF8"/>
        <text x="24" y="17" class="mono" font-size="10.5" fill="#CED5E0" letter-spacing="0.04em">CUDA / PARALLEL SCANS</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(346, 0)">
        <rect x="0" y="0" width="144" height="26" fill="#10141D" stroke="#222C3E" rx="3"/>
        <circle cx="12" cy="13" r="3" fill="#B66DDF"/>
        <text x="24" y="17" class="mono" font-size="10.5" fill="#CED5E0" letter-spacing="0.04em">SOT-MTJ CIRCUITS</text>
      </g>
    </g>

    <!-- Status Ticker Line -->
    <g transform="translate(0, 240)">
      <text x="0" y="0" class="mono" font-size="11" fill="#505D73">
        LATENCY: <tspan fill="#38BDF8">REAL-TIME</tspan> &#160;&#8226;&#160; 
        PARADIGM: <tspan fill="#F0F3F8">DETERMINISTIC</tspan> &#160;&#8226;&#160; 
        RUNTIME: <tspan fill="#B66DDF">LOW-OVERHEAD</tspan>
      </text>
    </g>
  </g>

  <!-- Vertical Divider with Coordinate Markings -->
  <g transform="translate(610, 50)">
    <line x1="0" y1="0" x2="0" y2="320" stroke="#1B2230" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="0" cy="80" r="2" fill="#B66DDF"/>
    <circle cx="0" cy="180" r="2" fill="#38BDF8"/>
    <circle cx="0" cy="280" r="2" fill="#505D73"/>
    <text x="8" y="83" class="mono" font-size="8.5" fill="#3F4A5E">AXIS: Z_0</text>
    <text x="8" y="183" class="mono" font-size="8.5" fill="#3F4A5E">AXIS: Z_1</text>
    <text x="8" y="283" class="mono" font-size="8.5" fill="#3F4A5E">AXIS: Z_2</text>
  </g>

  <!-- Right Visual Presentation: Original Computational & Silicon Architecture Graphic -->
  <g transform="translate(640, 50)">

    <!-- Sub-label header for diagram -->
    <g transform="translate(20, 10)">
      <text x="0" y="0" class="mono" font-size="10" fill="#6A778D" letter-spacing="0.12em">SCHEMATIC: STATE-SPACE &amp; SPINTRONIC TOPOLOGY</text>
      <text x="400" y="0" class="mono" font-size="9" fill="#38BDF8">FIG_00 // INTEGRATED</text>
      <line x1="0" y1="8" x2="500" y2="8" stroke="#161D2B" stroke-width="1"/>
    </g>

    <!-- Isometric Coordinate Surface -->
    <g transform="translate(60, 60)">
      <!-- Grid Plane Lines -->
      <path d="M 0 120 L 160 30 L 360 30 L 200 120 Z" fill="#0C0F17" stroke="#1C2434" stroke-width="1"/>
      <path d="M 40 100 L 200 10" stroke="#18202D" stroke-width="0.8"/>
      <path d="M 80 80 L 240 -10" stroke="#18202D" stroke-width="0.8"/>
      <path d="M 120 60 L 280 -30" stroke="#18202D" stroke-width="0.8"/>
      
      <!-- Coordinate Cross-Lines -->
      <path d="M 50 48 L 250 48" stroke="#18202D" stroke-width="0.8"/>
      <path d="M 90 70 L 290 70" stroke="#18202D" stroke-width="0.8"/>
      <path d="M 130 92 L 330 92" stroke="#18202D" stroke-width="0.8"/>

      <!-- SOT-MTJ Nanoscale Multilayer Representation (Silicon Stack) -->
      <g transform="translate(40, 120)">
        <!-- Heavy Metal (HM) Base Layer -->
        <polygon points="0,50 160,50 210,25 50,25" fill="#131924" stroke="#253248" stroke-width="1"/>
        <text x="80" y="44" class="mono" font-size="8.5" fill="#758296" letter-spacing="0.08em">HEAVY METAL (Ta/Pt)</text>
        <!-- Charge current vector J_e -->
        <line x1="15" y1="40" x2="60" y2="40" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#cyanArrow)"/>
        <text x="25" y="34" class="mono" font-size="8" fill="#38BDF8">J_c</text>
        <!-- Spin Current J_s arrow pointing upwards -->
        <line x1="105" y1="32" x2="105" y2="8" stroke="#B66DDF" stroke-width="1.8" stroke-dasharray="2 2"/>
        <polygon points="105,4 102,10 108,10" fill="#B66DDF"/>
        <text x="114" y="22" class="mono" font-size="8" fill="#B66DDF">J_s (Spin Hall)</text>

        <!-- Ferromagnetic Free Layer (FL) -->
        <polygon points="40,25 150,25 180,10 70,10" fill="#1C2030" stroke="#B66DDF" stroke-width="1"/>
        <text x="82" y="21" class="mono" font-size="7.5" fill="#CBB6DF">FREE LAYER (CoFeB)</text>

        <!-- Tunnel Barrier (MgO) -->
        <polygon points="45,10 145,10 172,-2 72,-2" fill="#121820" stroke="#00E5FF" stroke-width="0.75" stroke-dasharray="3 2"/>
        
        <!-- Pinned Layer (PL) -->
        <polygon points="50,-2 140,-2 165,-12 75,-12" fill="#182130" stroke="#3A4D6B" stroke-width="0.8"/>
        <text x="86" y="-5" class="mono" font-size="7.5" fill="#7E90AA">PINNED LAYER</text>
      </g>

      <!-- State-Space (S6 / Mamba) Dynamic Trajectory Representation -->
      <g transform="translate(190, 10)">
        <!-- State equation box -->
        <rect x="60" y="-10" width="190" height="32" fill="#0E121A" stroke="#252F42" rx="3"/>
        <text x="70" y="11" class="mono" font-size="10" fill="#B66DDF">h_t = A&#772; h_{t-1} + B&#772; x_t</text>
        <text x="70" y="24" class="mono" font-size="8.5" fill="#606E86">DISCRETIZED SELECTIVE SSM</text>

        <!-- State Scan Nodes (Parallel Prefix Scan Graph) -->
        <!-- Level 0 (inputs) -->
        <circle cx="60" cy="70" r="4.5" class="node-cyan"/>
        <text x="54" y="88" class="mono" font-size="8" fill="#38BDF8">x_0</text>
        
        <circle cx="110" cy="70" r="4.5" class="node-cyan"/>
        <text x="104" y="88" class="mono" font-size="8" fill="#38BDF8">x_1</text>
        
        <circle cx="160" cy="70" r="4.5" class="node-cyan"/>
        <text x="154" y="88" class="mono" font-size="8" fill="#38BDF8">x_2</text>
        
        <circle cx="210" cy="70" r="4.5" class="node-cyan"/>
        <text x="204" y="88" class="mono" font-size="8" fill="#38BDF8">x_3</text>

        <!-- Associative operator lines -->
        <line x1="60" y1="70" x2="85" y2="105" stroke="#2A3850" stroke-width="1.2"/>
        <line x1="110" y1="70" x2="85" y2="105" stroke="#2A3850" stroke-width="1.2"/>
        
        <line x1="160" y1="70" x2="185" y2="105" stroke="#2A3850" stroke-width="1.2"/>
        <line x1="210" y1="70" x2="185" y2="105" stroke="#2A3850" stroke-width="1.2"/>

        <!-- Level 1 operator nodes -->
        <circle cx="85" cy="105" r="5" class="node-core"/>
        <circle cx="185" cy="105" r="5" class="node-core"/>
        <text x="82" y="108" class="mono" font-size="9" fill="#B66DDF">&#8855;</text>
        <text x="182" y="108" class="mono" font-size="9" fill="#B66DDF">&#8855;</text>

        <!-- Scan Tree Bridge (Blelloch scan in CUDA) -->
        <path d="M 85 110 L 85 140 L 185 140 L 185 110" fill="none" stroke="#B66DDF" stroke-width="1.2" stroke-dasharray="2 2"/>
        <circle cx="135" cy="140" r="6" fill="#120E1E" stroke="#B66DDF" stroke-width="1.5"/>
        <text x="131" y="143" class="mono" font-size="8.5" fill="#F0F3F8">&#8226;</text>
        
        <!-- Output states h_k -->
        <path d="M 85 110 L 85 175" stroke="#38BDF8" stroke-width="1.2"/>
        <path d="M 185 140 L 185 175" stroke="#38BDF8" stroke-width="1.2"/>
        <circle cx="85" cy="175" r="3.5" fill="#38BDF8"/>
        <circle cx="185" cy="175" r="3.5" fill="#38BDF8"/>
        <text x="76" y="192" class="mono" font-size="8.5" fill="#38BDF8">h_1</text>
        <text x="176" y="192" class="mono" font-size="8.5" fill="#38BDF8">h_3</text>
        <text x="215" y="160" class="mono" font-size="8" fill="#6A778D">CUDA SCAN: O(log N)</text>
      </g>
    </g>

    <!-- Oscilloscope Real-Time Signal Line at Bottom -->
    <g transform="translate(10, 275)">
      <!-- Frame for signal -->
      <rect x="0" y="0" width="510" height="55" fill="#0A0D15" stroke="#1D2536" rx="3"/>
      <!-- Grid tick marks -->
      <line x1="0" y1="27.5" x2="510" y2="27.5" stroke="#151C2A" stroke-width="0.75" stroke-dasharray="4 4"/>
      <line x1="100" y1="0" x2="100" y2="55" stroke="#151C2A" stroke-width="0.5"/>
      <line x1="200" y1="0" x2="200" y2="55" stroke="#151C2A" stroke-width="0.5"/>
      <line x1="300" y1="0" x2="300" y2="55" stroke="#151C2A" stroke-width="0.5"/>
      <line x1="400" y1="0" x2="400" y2="55" stroke="#151C2A" stroke-width="0.5"/>
      
      <!-- Waveform path (Square clock + analog transient response) -->
      <path d="M 10 27.5 L 45 27.5 L 50 10 L 80 10 L 85 45 L 115 45 L 120 12 L 140 12 Q 155 12 165 27.5 T 195 27.5 L 210 8 L 240 8 L 245 42 L 275 42 L 280 27.5 L 320 27.5 Q 335 15 350 27.5 T 380 27.5 L 400 8 L 430 8 L 435 46 L 460 46 L 465 27.5 L 500 27.5" 
            fill="none" stroke="#B66DDF" stroke-width="1.6" stroke-linejoin="round"/>
      
      <!-- Waveform overlay cyan pulse -->
      <path d="M 195 27.5 L 210 8 L 240 8 L 245 42 L 275 42 L 280 27.5" 
            fill="none" stroke="#00E5FF" stroke-width="2" stroke-linejoin="round" opacity="0.8"/>

      <!-- Annotations -->
      <text x="12" y="14" class="mono" font-size="8" fill="#4ECCD3">OSCILLOSCOPE // CH_1: SOT_SWITCHING_LATENCY</text>
      <text x="360" y="14" class="mono" font-size="8" fill="#9AA4B2">&#916;t = 1.0 ns &#8226; t_cyc = 6.0 ns</text>
      <text x="12" y="47" class="mono" font-size="8" fill="#5A677F">POWER: P2 THRESHOLD [64, 128, 192]</text>
      <text x="400" y="47" class="mono" font-size="8" fill="#B66DDF">VERIFIED ICMAGMA/MMM</text>
    </g>

  </g>

</svg>
