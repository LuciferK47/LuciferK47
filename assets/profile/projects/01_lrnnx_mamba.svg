<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="100%" height="auto" style="background:#0A0D14;border-radius:6px;border:1px solid #1C2436;">
  <defs>
    <linearGradient id="mambaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B66DDF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="diagGrid1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#141B28" stroke-width="0.75"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .lbl { font-size: 9px; fill: #6B7C96; letter-spacing: 0.08em; }
      .val { font-size: 11px; fill: #E2E8F0; font-weight: 600; }
    </style>
  </defs>

  <rect width="760" height="170" fill="#0A0D14"/>
  <rect width="760" height="170" fill="url(#diagGrid1)"/>

  <!-- Top Metadata Header -->
  <g transform="translate(24, 20)">
    <text x="0" y="0" class="mono lbl" fill="#B66DDF">SYS.MOD // 01</text>
    <text x="80" y="0" class="mono lbl">&#8226;</text>
    <text x="95" y="0" class="mono lbl">SELECTIVE STATE-SPACE SCAN KERNEL</text>
    <rect x="580" y="-10" width="132" height="18" fill="#141026" stroke="#B66DDF" stroke-width="0.8" rx="2"/>
    <text x="586" y="2" class="mono" font-size="8.5" fill="#CBB4E8" font-weight="700">EACL 2026 SRW ACCEPTED</text>
  </g>

  <!-- Flow Block 1: Discretization -->
  <g transform="translate(24, 38)">
    <rect x="0" y="0" width="190" height="106" fill="#0E131E" stroke="#222C3E" rx="4"/>
    <text x="14" y="22" class="mono lbl">PARAMETERIZATION</text>
    <text x="14" y="44" class="mono val" fill="#B66DDF">s_t = A&#772;_t s_{t-1} + B&#772;_t x_t</text>
    <text x="14" y="66" class="mono" font-size="9.5" fill="#8F9EAF">A&#772; = exp(&#916; &#8226; A)</text>
    <text x="14" y="82" class="mono" font-size="9.5" fill="#8F9EAF">B&#772; = (&#916;A)&#8315;&#185;(A&#772; - I) &#8226; &#916;B</text>
    <text x="14" y="98" class="mono lbl" fill="#38BDF8">SELECTIVE INPUT-DEPENDENT</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(220, 90)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#38BDF8" stroke-width="1.5"/>
    <polygon points="20,0 15,-3 15,3" fill="#38BDF8"/>
    <text x="-4" y="-8" class="mono lbl" font-size="8">&#916;, B, C(x)</text>
  </g>

  <!-- Flow Block 2: Parallel Scan Tree (CUDA) -->
  <g transform="translate(248, 38)">
    <rect x="0" y="0" width="280" height="106" fill="#0E131E" stroke="#222C3E" rx="4"/>
    <text x="14" y="22" class="mono lbl">CUDA WARP PARALLEL PREFIX SCAN</text>
    
    <!-- Tree illustration -->
    <g transform="translate(18, 38)">
      <!-- Leaf nodes -->
      <circle cx="10" cy="48" r="4" fill="#1C2436" stroke="#38BDF8"/>
      <circle cx="45" cy="48" r="4" fill="#1C2436" stroke="#38BDF8"/>
      <circle cx="80" cy="48" r="4" fill="#1C2436" stroke="#38BDF8"/>
      <circle cx="115" cy="48" r="4" fill="#1C2436" stroke="#38BDF8"/>
      <circle cx="150" cy="48" r="4" fill="#1C2436" stroke="#38BDF8"/>
      <circle cx="185" cy="48" r="4" fill="#1C2436" stroke="#38BDF8"/>
      <circle cx="220" cy="48" r="4" fill="#1C2436" stroke="#38BDF8"/>

      <!-- Up-sweep branches -->
      <path d="M 10 44 L 27.5 28 M 45 44 L 27.5 28" stroke="#B66DDF" stroke-width="1.2"/>
      <path d="M 80 44 L 97.5 28 M 115 44 L 97.5 28" stroke="#B66DDF" stroke-width="1.2"/>
      <path d="M 150 44 L 167.5 28 M 185 44 L 167.5 28" stroke="#B66DDF" stroke-width="1.2"/>

      <circle cx="27.5" cy="28" r="4" fill="#0E131E" stroke="#B66DDF"/>
      <circle cx="97.5" cy="28" r="4" fill="#0E131E" stroke="#B66DDF"/>
      <circle cx="167.5" cy="28" r="4" fill="#0E131E" stroke="#B66DDF"/>

      <!-- Root sweep -->
      <path d="M 27.5 24 L 62.5 8 M 97.5 24 L 62.5 8" stroke="#38BDF8" stroke-width="1.2"/>
      <circle cx="62.5" cy="8" r="4.5" fill="#B66DDF"/>
    </g>

    <!-- Scan Specs -->
    <text x="14" y="60" class="mono lbl" fill="#8E9DAE">REDUCTION: BLELLOCH SCAN</text>
    <text x="14" y="98" class="mono lbl" fill="#38BDF8">COMPLEXITY: O(log T) WORK-EFFICIENT</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <g transform="translate(534, 90)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#B66DDF" stroke-width="1.5"/>
    <polygon points="20,0 15,-3 15,3" fill="#B66DDF"/>
    <text x="2" y="-8" class="mono lbl" font-size="8">y_t</text>
  </g>

  <!-- Flow Block 3: Runtimes / Output -->
  <g transform="translate(560, 38)">
    <rect x="0" y="0" width="176" height="106" fill="#0E131E" stroke="#222C3E" rx="4"/>
    <text x="14" y="22" class="mono lbl">PYTORCH RUNTIME</text>
    <text x="14" y="44" class="mono val" fill="#F0F3F8">y_t = C_t &#8226; s_t</text>
    <text x="14" y="66" class="mono" font-size="9.5" fill="#8F9EAF">MEMORY: O(1) INFERENCE</text>
    <text x="14" y="82" class="mono" font-size="9.5" fill="#8F9EAF">AUTOGRAD: CUSTOM FUSED</text>
    <text x="14" y="98" class="mono lbl" fill="#B66DDF">ZERO TENSOR RE-ALLOC</text>
  </g>
</svg>
