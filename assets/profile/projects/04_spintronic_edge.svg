<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="100%" height="auto" style="background:#0A0D14;border-radius:6px;border:1px solid #1C2436;">
  <defs>
    <pattern id="diagGrid4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#141B28" stroke-width="0.75"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .lbl { font-size: 9px; fill: #6B7C96; letter-spacing: 0.08em; }
      .val { font-size: 11px; fill: #E2E8F0; font-weight: 600; }
    </style>
  </defs>

  <rect width="760" height="170" fill="#0A0D14"/>
  <rect width="760" height="170" fill="url(#diagGrid4)"/>

  <!-- Top Metadata Header -->
  <g transform="translate(24, 20)">
    <text x="0" y="0" class="mono lbl" fill="#B66DDF">SYS.MOD // 04</text>
    <text x="80" y="0" class="mono lbl">&#8226;</text>
    <text x="95" y="0" class="mono lbl">SPINTRONIC SOT-MTJ EDGE EXTRACTION ARRAY</text>
    <rect x="525" y="-10" width="195" height="18" fill="#141026" stroke="#B66DDF" stroke-width="0.8" rx="2"/>
    <text x="531" y="2" class="mono" font-size="8.5" fill="#CBB4E8" font-weight="700">ICMAGMA 2026 &#8226; MMM 2026</text>
  </g>

  <!-- Block 1: Power-of-2 Comparator-Free Thresholding -->
  <g transform="translate(24, 38)">
    <rect x="0" y="0" width="210" height="106" fill="#0E131E" stroke="#222C3E" rx="4"/>
    <text x="14" y="22" class="mono lbl">INTENSITY PLANE EXTRACTION</text>
    <text x="14" y="44" class="mono val" fill="#B66DDF">Power-of-Two Thresholds</text>
    <text x="14" y="66" class="mono" font-size="9.5" fill="#8F9EAF">&#8226; T_192 = bit7 AND bit6</text>
    <text x="14" y="82" class="mono" font-size="9.5" fill="#8F9EAF">&#8226; T_128 = bit7 | T_64 = bit7 OR bit6</text>
    <text x="14" y="98" class="mono lbl" fill="#38BDF8">COMPARATOR-FREE (2 GATES)</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(240, 90)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#38BDF8" stroke-width="1.5"/>
    <polygon points="22,0 17,-3 17,3" fill="#38BDF8"/>
    <text x="-4" y="-8" class="mono lbl" font-size="7.5">3 PLANES</text>
  </g>

  <!-- Block 2: SOT-MTJ Bit-Cell Array Processing -->
  <g transform="translate(268, 38)">
    <rect x="0" y="0" width="250" height="106" fill="#0E131E" stroke="#222C3E" rx="4"/>
    <text x="14" y="22" class="mono lbl">HARDWARE ARRAY // 3&#215;3 NEIGHBORHOOD</text>
    
    <!-- 3x3 Grid of SOT-MTJ Cells -->
    <g transform="translate(14, 34)">
      <!-- 3x3 cells -->
      <rect x="0" y="0" width="14" height="14" fill="#1C2436" stroke="#38BDF8" rx="1"/>
      <rect x="18" y="0" width="14" height="14" fill="#241B38" stroke="#B66DDF" rx="1"/>
      <rect x="36" y="0" width="14" height="14" fill="#1C2436" stroke="#38BDF8" rx="1"/>

      <rect x="0" y="18" width="14" height="14" fill="#241B38" stroke="#B66DDF" rx="1"/>
      <rect x="18" y="18" width="14" height="14" fill="#B66DDF" stroke="#F0F3F8" rx="1"/>
      <rect x="36" y="18" width="14" height="14" fill="#241B38" stroke="#B66DDF" rx="1"/>

      <rect x="0" y="36" width="14" height="14" fill="#1C2436" stroke="#38BDF8" rx="1"/>
      <rect x="18" y="36" width="14" height="14" fill="#241B38" stroke="#B66DDF" rx="1"/>
      <rect x="36" y="36" width="14" height="14" fill="#1C2436" stroke="#38BDF8" rx="1"/>
    </g>

    <g transform="translate(74, 34)">
      <text x="0" y="14" class="mono val" fill="#E2E8F0">Binary Mixedness</text>
      <text x="0" y="30" class="mono" font-size="9" fill="#8F9EAF">Dilation &#8722; Erosion</text>
      <text x="0" y="46" class="mono" font-size="9" fill="#8F9EAF">Cycle: 2.5 / 1.0 / 2.5 ns</text>
    </g>

    <text x="14" y="98" class="mono lbl" fill="#B66DDF">LOW READ/WRITE CURRENT</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <g transform="translate(524, 90)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#B66DDF" stroke-width="1.5"/>
    <polygon points="22,0 17,-3 17,3" fill="#B66DDF"/>
    <text x="-2" y="-8" class="mono lbl" font-size="7.5">VOTE</text>
  </g>

  <!-- Block 3: Majority Fusion & Benchmark -->
  <g transform="translate(552, 38)">
    <rect x="0" y="0" width="184" height="106" fill="#0E131E" stroke="#222C3E" rx="4"/>
    <text x="14" y="22" class="mono lbl">MAJORITY FUSION</text>
    <text x="14" y="44" class="mono val" fill="#38BDF8">&#8805; 2 Planes Agreement</text>
    <text x="14" y="66" class="mono" font-size="9.5" fill="#8F9EAF">&#8226; BSDS500 Benchmark</text>
    <text x="14" y="82" class="mono" font-size="9.5" fill="#8F9EAF">&#8226; Canny Boundary Match</text>
    <text x="14" y="98" class="mono lbl" fill="#38BDF8">VERILOG RTL VALIDATED</text>
  </g>
</svg>
