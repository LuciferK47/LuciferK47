<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="100%" height="auto" style="background:#0A0D14;border-radius:6px;border:1px solid #1C2436;">
  <defs>
    <pattern id="diagGrid5" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#141B28" stroke-width="0.75"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .lbl { font-size: 9px; fill: #6B7C96; letter-spacing: 0.08em; }
      .val { font-size: 11px; fill: #E2E8F0; font-weight: 600; }
    </style>
  </defs>

  <rect width="760" height="170" fill="#0A0D14"/>
  <rect width="760" height="170" fill="url(#diagGrid5)"/>

  <!-- Top Metadata Header -->
  <g transform="translate(24, 20)">
    <text x="0" y="0" class="mono lbl" fill="#B66DDF">SYS.MOD // 05</text>
    <text x="80" y="0" class="mono lbl">&#8226;</text>
    <text x="95" y="0" class="mono lbl">FLIGHT CONTROL LOOP &amp; TELEMETRY EXTENSIONS</text>
    <rect x="560" y="-10" width="160" height="18" fill="#141026" stroke="#38BDF8" stroke-width="0.8" rx="2"/>
    <text x="566" y="2" class="mono" font-size="8.5" fill="#38BDF8" font-weight="700">&#8722;12% CONTROL-LOOP LATENCY</text>
  </g>

  <!-- Block 1: Real-time SITL Scheduler -->
  <g transform="translate(24, 38)">
    <rect x="0" y="0" width="220" height="106" fill="#0E131E" stroke="#222C3E" rx="4"/>
    <text x="14" y="22" class="mono lbl">ARDUPILOT C++ CORE</text>
    <text x="14" y="44" class="mono val" fill="#F0F3F8">400Hz Main Flight Loop</text>
    <text x="14" y="66" class="mono" font-size="9.5" fill="#8F9EAF">&#8226; Fast-Path Ring Buffers</text>
    <text x="14" y="82" class="mono" font-size="9.5" fill="#8F9EAF">&#8226; Deterministic Jitter Guard</text>
    <text x="14" y="98" class="mono lbl" fill="#38BDF8">SUB-MILLISECOND PRECISION</text>
  </g>

  <!-- Channel 1 to 2 -->
  <g transform="translate(250, 90)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#B66DDF" stroke-width="1.5"/>
    <polygon points="22,0 17,-3 17,3" fill="#B66DDF"/>
    <text x="-4" y="-8" class="mono lbl" font-size="7.5">PACKETS</text>
  </g>

  <!-- Block 2: Optimized MAVLink Serialization -->
  <g transform="translate(278, 38)">
    <rect x="0" y="0" width="240" height="106" fill="#0E131E" stroke="#222C3E" rx="4"/>
    <text x="14" y="22" class="mono lbl">MAVLINK PROTOCOL LAYER</text>
    <text x="14" y="44" class="mono val" fill="#B66DDF">Custom Micro-Extensions</text>
    <text x="14" y="66" class="mono" font-size="9.5" fill="#8F9EAF">&#8226; Zero-Copy Payload Encode</text>
    <text x="14" y="82" class="mono" font-size="9.5" fill="#8F9EAF">&#8226; Telemetry Diagnostic Sinks</text>
    <text x="14" y="98" class="mono lbl" fill="#B66DDF">NON-BLOCKING IO DISPATCH</text>
  </g>

  <!-- Channel 2 to 3 -->
  <g transform="translate(524, 90)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#38BDF8" stroke-width="1.5"/>
    <polygon points="22,0 17,-3 17,3" fill="#38BDF8"/>
    <text x="-2" y="-8" class="mono lbl" font-size="7.5">UDP</text>
  </g>

  <!-- Block 3: SITL Latency Delta Benchmark -->
  <g transform="translate(552, 38)">
    <rect x="0" y="0" width="184" height="106" fill="#0E131E" stroke="#222C3E" rx="4"/>
    <text x="14" y="22" class="mono lbl">SITL PROFILING BENCH</text>
    <text x="14" y="44" class="mono val" fill="#38BDF8">Latency &amp; Jitter Metrics</text>
    <text x="14" y="66" class="mono" font-size="9.5" fill="#8F9EAF">&#8226; Loop Jitter: &#8722;12%</text>
    <text x="14" y="82" class="mono" font-size="9.5" fill="#8F9EAF">&#8226; Real-Time SITL Sync</text>
    <text x="14" y="98" class="mono lbl" fill="#38BDF8">C++ / MAVLINK / SITL</text>
  </g>
</svg>
