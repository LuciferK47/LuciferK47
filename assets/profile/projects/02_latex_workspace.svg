<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="100%" height="auto" style="background:#0A0D14;border-radius:6px;border:1px solid #1C2436;">
  <defs>
    <pattern id="diagGrid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#141B28" stroke-width="0.75"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .lbl { font-size: 9px; fill: #6B7C96; letter-spacing: 0.08em; }
      .val { font-size: 11px; fill: #E2E8F0; font-weight: 600; }
    </style>
  </defs>

  <rect width="760" height="170" fill="#0A0D14"/>
  <rect width="760" height="170" fill="url(#diagGrid2)"/>

  <!-- Top Metadata Header -->
  <g transform="translate(24, 20)">
    <text x="0" y="0" class="mono lbl" fill="#B66DDF">SYS.MOD // 02</text>
    <text x="80" y="0" class="mono lbl">&#8226;</text>
    <text x="95" y="0" class="mono lbl">IN-PROCESS COMPILER &amp; SELF-HEALING AST ENGINE</text>
    <rect x="580" y="-10" width="144" height="18" fill="#141026" stroke="#38BDF8" stroke-width="0.8" rx="2"/>
    <text x="586" y="2" class="mono" font-size="8.5" fill="#38BDF8" font-weight="700">DESKTOP SHELL + AXUM</text>
  </g>

  <!-- Block 1: Client Editor UI -->
  <g transform="translate(24, 38)">
    <rect x="0" y="0" width="210" height="106" fill="#0E131E" stroke="#222C3E" rx="4"/>
    <text x="14" y="22" class="mono lbl">FRONTEND (SVELTE / TS)</text>
    <text x="14" y="44" class="mono val" fill="#F0F3F8">Monaco Editor + PDF Canvas</text>
    <text x="14" y="66" class="mono" font-size="9.5" fill="#8F9EAF">&#8226; Streaming Hunk Diffs</text>
    <text x="14" y="82" class="mono" font-size="9.5" fill="#8F9EAF">&#8226; SyncTeX Click-to-Source</text>
    <text x="14" y="98" class="mono lbl" fill="#38BDF8">SUB-50MS UI REACTIVITY</text>
  </g>

  <!-- Bidirectional Channel between 1 and 2 -->
  <g transform="translate(240, 78)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#B66DDF" stroke-width="1.2"/>
    <polygon points="22,0 17,-3 17,3" fill="#B66DDF"/>
    <line x1="22" y1="16" x2="0" y2="16" stroke="#38BDF8" stroke-width="1.2"/>
    <polygon points="0,16 5,13 5,19" fill="#38BDF8"/>
    <text x="-4" y="-5" class="mono lbl" font-size="7.5">IPC / WS</text>
  </g>

  <!-- Block 2: Rust Axum Server Core -->
  <g transform="translate(268, 38)">
    <rect x="0" y="0" width="230" height="106" fill="#0E131E" stroke="#222C3E" rx="4"/>
    <text x="14" y="22" class="mono lbl">RUST ENGINE (AXUM CORE)</text>
    <text x="14" y="44" class="mono val" fill="#B66DDF">In-Process Compilation</text>
    <text x="14" y="66" class="mono" font-size="9.5" fill="#8F9EAF">&#8226; TeX Parser Memory-Mapped</text>
    <text x="14" y="82" class="mono" font-size="9.5" fill="#8F9EAF">&#8226; AST Error Diagnostics</text>
    <text x="14" y="98" class="mono lbl" fill="#B66DDF">ZERO SPAWNED CLI OVERHEAD</text>
  </g>

  <!-- Arrow 2 to 3 Loop -->
  <g transform="translate(504, 78)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#38BDF8" stroke-width="1.2"/>
    <polygon points="24,0 19,-3 19,3" fill="#38BDF8"/>
    <line x1="24" y1="16" x2="0" y2="16" stroke="#B66DDF" stroke-width="1.2"/>
    <polygon points="0,16 5,13 5,19" fill="#B66DDF"/>
    <text x="0" y="-5" class="mono lbl" font-size="7.5">PATCH</text>
  </g>

  <!-- Block 3: Self-Healing AI Pipeline -->
  <g transform="translate(534, 38)">
    <rect x="0" y="0" width="202" height="106" fill="#0E131E" stroke="#222C3E" rx="4"/>
    <text x="14" y="22" class="mono lbl">SELF-HEALING RECOVERY</text>
    <text x="14" y="44" class="mono val" fill="#38BDF8">LLM Diagnostic Patch Loop</text>
    <text x="14" y="66" class="mono" font-size="9.5" fill="#8F9EAF">&#8226; Hunk-Level Dissection</text>
    <text x="14" y="82" class="mono" font-size="9.5" fill="#8F9EAF">&#8226; Automated Re-execution</text>
    <text x="14" y="98" class="mono lbl" fill="#B66DDF">DETERMINISTIC HEALING</text>
  </g>
</svg>
