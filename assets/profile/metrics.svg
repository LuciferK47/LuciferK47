<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" height="auto" style="background:#090B10;border-radius:6px;border:1px solid #1C2436;">
  <defs>
    <pattern id="metricGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#131926" stroke-width="0.75"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .lbl { font-size: 9.5px; fill: #63738A; letter-spacing: 0.1em; }
      .stat-num { font-size: 28px; font-weight: 800; fill: #F0F3F8; }
      .stat-sub { font-size: 11px; fill: #8F9EAF; }
    </style>
  </defs>

  <rect width="1200" height="180" fill="#090B10"/>
  <rect width="1200" height="180" fill="url(#metricGrid)"/>

  <!-- Column 1: Verification & Research Milestones -->
  <g transform="translate(36, 26)">
    <text x="0" y="0" class="mono lbl" fill="#B66DDF">SYS.TEL // 01 &#8212; RESEARCH MILESTONES</text>
    
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="340" height="100" fill="#0D111A" stroke="#1E273A" rx="4"/>
      
      <circle cx="20" cy="30" r="3" fill="#B66DDF"/>
      <text x="32" y="34" class="mono" font-size="11" font-weight="700" fill="#E2E8F0">EACL 2026 SRW</text>
      <text x="32" y="48" class="mono" font-size="9.5" fill="#8F9EAF">LRNNX S6 Mamba State-Space Model</text>
      
      <line x1="20" y1="58" x2="320" y2="58" stroke="#182030" stroke-width="1"/>

      <circle cx="20" cy="74" r="3" fill="#38BDF8"/>
      <text x="32" y="78" class="mono" font-size="11" font-weight="700" fill="#E2E8F0">ICMAGMA 2026 / MMM 2026</text>
      <text x="32" y="92" class="mono" font-size="9.5" fill="#8F9EAF">SOT-MTJ Spintronic Edge Detection</text>
    </g>
  </g>

  <!-- Column 2: Compute & Architecture Profile -->
  <g transform="translate(426, 26)">
    <text x="0" y="0" class="mono lbl" fill="#38BDF8">SYS.TEL // 02 &#8212; PERFORMANCE TARGETS</text>
    
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="340" height="100" fill="#0D111A" stroke="#1E273A" rx="4"/>
      
      <g transform="translate(24, 25)">
        <text x="0" y="24" class="mono stat-num" fill="#B66DDF">&#8722;32.2%</text>
        <text x="0" y="42" class="mono stat-sub">Perplexity Delta</text>
        <text x="0" y="56" class="mono lbl">WikiText-2 Benchmark</text>
      </g>

      <line x1="170" y1="18" x2="170" y2="84" stroke="#1A2234" stroke-width="1"/>

      <g transform="translate(194, 25)">
        <text x="0" y="24" class="mono stat-num" fill="#38BDF8">&#8722;12%</text>
        <text x="0" y="42" class="mono stat-sub">Loop Jitter Latency</text>
        <text x="0" y="56" class="mono lbl">ArduPilot SITL Test</text>
      </g>
    </g>
  </g>

  <!-- Column 3: Stack Coverage & Verification -->
  <g transform="translate(816, 26)">
    <text x="0" y="0" class="mono lbl" fill="#9AA4B2">SYS.TEL // 03 &#8212; SYSTEM COUPLING</text>
    
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="348" height="100" fill="#0D111A" stroke="#1E273A" rx="4"/>
      
      <g transform="translate(20, 20)">
        <text x="0" y="12" class="mono" font-size="10" fill="#7E8FA5">SILICON / HDL:</text>
        <text x="130" y="12" class="mono" font-size="10" fill="#E2E8F0">Verilog, Cadence, SOT-MTJ</text>

        <text x="0" y="32" class="mono" font-size="10" fill="#7E8FA5">LOW-LEVEL / SYS:</text>
        <text x="130" y="32" class="mono" font-size="10" fill="#B66DDF">CUDA, C++, Rust, Linux</text>

        <text x="0" y="52" class="mono" font-size="10" fill="#7E8FA5">SEQUENCE MODELS:</text>
        <text x="130" y="52" class="mono" font-size="10" fill="#38BDF8">SSM / S6, Mamba, PyTorch</text>

        <text x="0" y="72" class="mono" font-size="10" fill="#7E8FA5">ROBOTICS / CTL:</text>
        <text x="130" y="72" class="mono" font-size="10" fill="#E2E8F0">ArduPilot, MAVLink, SITL</text>
      </g>
    </g>
  </g>
</svg>
