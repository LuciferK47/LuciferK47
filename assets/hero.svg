<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Kushagra Singh - Silicon, Systems, Intelligence">
  <rect width="1200" height="300" fill="#0c0e13"/>
  <defs>
    <radialGradient id="grad1" cx="0.3" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad2" cx="0.7" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#7df9ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7df9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad3" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0%" stop-color="#ff7eb3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff7eb3" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>
  <circle cx="360" cy="150" r="200" fill="url(#grad1)" filter="url(#blur)"/>
  <circle cx="840" cy="80" r="180" fill="url(#grad2)" filter="url(#blur)"/>
  <circle cx="600" cy="240" r="220" fill="url(#grad3)" filter="url(#blur)"/>
  <text x="50%" y="45%" text-anchor="middle" fill="#f0f1f5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="700" letter-spacing="-0.02em">Kushagra Singh</text>
  <text x="50%" y="60%" text-anchor="middle" fill="#9aa3b2" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="0.1em">SILICON • SYSTEMS • INTELLIGENCE</text>
  <line x1="40%" y1="65%" x2="60%" y2="65%" stroke="#b66ddf" stroke-width="2" opacity="0.5"/>
</svg>
