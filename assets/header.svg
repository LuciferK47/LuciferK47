<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" fill="none">
  <rect width="840" height="280" fill="#0C0E13"/>

  <!-- Subtle geometric motif: state-space trajectory + circuit traces -->
  <g opacity="0.12" stroke="#B66DDF" stroke-width="1">
    <!-- Flowing trajectory curves suggesting state transitions -->
    <path d="M 560 220 Q 600 160, 640 170 T 720 130 T 790 100" stroke-width="1.2"/>
    <path d="M 580 240 Q 620 190, 660 195 T 740 155 T 810 120" stroke-width="0.8"/>
    <path d="M 540 210 Q 570 150, 620 155 T 700 115 T 770 85" stroke-width="0.6"/>
  </g>

  <g opacity="0.08" stroke="#B66DDF" stroke-width="0.7">
    <!-- Fine orthogonal traces suggesting silicon routing -->
    <path d="M 620 260 L 620 200 L 680 200 L 680 160 L 740 160"/>
    <path d="M 650 260 L 650 220 L 710 220 L 710 180 L 760 180"/>
    <path d="M 590 250 L 590 230 L 640 230 L 640 190 L 700 190"/>
  </g>

  <!-- Small node dots at trajectory intersections -->
  <circle cx="640" cy="170" r="2" fill="#B66DDF" opacity="0.25"/>
  <circle cx="720" cy="130" r="2" fill="#B66DDF" opacity="0.20"/>
  <circle cx="680" cy="200" r="1.5" fill="#B66DDF" opacity="0.15"/>
  <circle cx="710" cy="180" r="1.5" fill="#B66DDF" opacity="0.15"/>
  <circle cx="790" cy="100" r="2.5" fill="#B66DDF" opacity="0.22"/>

  <!-- Name -->
  <text x="56" y="118" fill="#F0F1F5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="46" font-weight="700" letter-spacing="-0.02em">Kushagra Singh</text>

  <!-- Identity line -->
  <text x="58" y="156" fill="#9AA3B2" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" letter-spacing="0.18em">SILICON</text>
  <text x="138" y="156" fill="#4A5568" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5">&#183;</text>
  <text x="154" y="156" fill="#9AA3B2" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" letter-spacing="0.18em">SYSTEMS</text>
  <text x="254" y="156" fill="#4A5568" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5">&#183;</text>
  <text x="270" y="156" fill="#9AA3B2" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" letter-spacing="0.18em">INTELLIGENCE</text>

  <!-- Thin accent line -->
  <line x1="58" y1="175" x2="128" y2="175" stroke="#B66DDF" stroke-width="2" opacity="0.7"/>

  <!-- Short descriptor -->
  <text x="58" y="210" fill="#6B7688" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" letter-spacing="0.01em">Engineering student at BITS Pilani, Goa</text>

  <!-- Thin bottom border -->
  <line x1="0" y1="279" x2="840" y2="279" stroke="#1E2330" stroke-width="1"/>
</svg>
