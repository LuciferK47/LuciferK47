<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-label="Spintronic Edge Detection">
  <rect width="400" height="250" fill="#0c0e13"/>
  <defs>
    <radialGradient id="grad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>
  <circle cx="200" cy="125" r="150" fill="url(#grad)" filter="url(#blur)"/>
  <text x="50%" y="55%" text-anchor="middle" fill="#f0f1f5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">Spintronic Edge</text>
  <text x="50%" y="70%" text-anchor="middle" fill="#9aa3b2" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14">Detection • MTJ</text>
</svg>
